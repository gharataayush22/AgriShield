<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AgriShield{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        {% if farmer_name %}
            <a class="brand" href="/menu">🌱 AgriShield</a>
            <div class="links">
                <a href="/menu">Menu</a>
                <span class="user">Hi, {{ farmer_name }}</span>
            </div>
        {% else %}
            <span class="brand">🌱 AgriShield</span>
        {% endif %}
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% for m in messages %}
                <div class="flash">{{ m }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script>
        // Fade the page out before moving to the next one
        document.addEventListener("click", function (e) {
            var a = e.target.closest("a");
            if (!a || !a.href) return;
            if (a.target === "_blank" || a.href.indexOf(location.origin) !== 0) return;
            e.preventDefault();
            document.body.classList.add("leaving");
            setTimeout(function () { window.location = a.href; }, 300);
        });

        document.addEventListener("submit", function () {
            document.body.classList.add("leaving");
        });

        // If the user presses the Back button, show the page again
        window.addEventListener("pageshow", function () {
            document.body.classList.remove("leaving");
        });
    </script>
</body>
</html>

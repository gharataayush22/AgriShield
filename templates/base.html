<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AgriShield{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="/">🌱 AgriShield</a>
        <div class="links">
            <a href="/">Diagnose</a>
            <a href="/history">Track Record</a>
            <a href="/feedback">Feedback</a>
            {% if farmer_name %}
                <span class="user">Hi, {{ farmer_name }}</span>
                <a href="/logout">Logout</a>
            {% else %}
                <a href="/track">Login</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% for m in messages %}
                <div class="flash">{{ m }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>

{% extends "base.html" %}
{% block title %}Welcome - AgriShield{% endblock %}

{% block content %}
<div class="page-center">
    <div class="narrow">
        <h1>Welcome, {{ name }}!</h1>
        <p>Your personal farmer ID is:</p>
        <p class="code">{{ code }}</p>

        <div class="warn-box">
            ⚠️ Write this down now. You need your name and this ID to log in
            next time. It will not be shown again.
        </div>

        <a href="/menu"><button type="button">Go to menu</button></a>
    </div>
</div>
{% endblock %}
